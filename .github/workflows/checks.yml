name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: zapshare
          POSTGRES_PASSWORD: zapshare_ci
          POSTGRES_DB: zapshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zapshare -d zapshare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://zapshare:zapshare_ci@127.0.0.1:5432/zapshare_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            zapshare-backend/package-lock.json
            zapshare-frontend/package-lock.json
      - name: Check backend
        working-directory: zapshare-backend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test -- --runInBand
          npm run test:e2e -- --runInBand
      - name: Build frontend
        working-directory: zapshare-frontend
        run: |
          npm ci
          npm run build
